<!DOCTYPE html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>জুনাইদ আল হাবিব । খতিব ও মাদরাসা শিক্ষক</title>

    <!-- ফেভিকন — প্রোফাইল ছবি থেকে জেনারেট করা -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#16a34a" />
    <meta name="description" content="জুনাইদ আল হাবিব — মাওলানা ও মুফতি, ওয়েব ডেভলপার, ভিডিও এডিটর, ডিজিটাল মার্কেটার" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Tiro+Bangla:ital@0;1&family=Amiri:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet" />
    <!-- হিরো সেকশনের প্রোফাইল ছবি (LCP এলিমেন্ট) আগে থেকেই ফেচ শুরু করে দেয়,
         যাতে JS বান্ডল লোড/পার্স হওয়ার আগেই ছবিটা রেডি থাকে -->
    <link rel="preload" as="image" href="/images/profile.webp" fetchpriority="high" />
    <script>
      // পেজ রেন্ডার হওয়ার আগেই থিম সেট করে দেয়, যাতে ডার্ক মোডে সাদা ব্যাকগ্রাউন্ড
      // এক মুহূর্তের জন্যও ফ্ল্যাশ (flash) না করে
      (function () {
        var saved = localStorage.getItem('theme');
        var wantsDark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (wantsDark) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
